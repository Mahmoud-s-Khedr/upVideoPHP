# Nginx configuration for PHP Video Upload & HLS Streaming System
#
# Place this file at /etc/nginx/sites-available/videosystem and symlink to sites-enabled/.
# Adjust server_name and SSL cert paths for your domain.
#
# ---------------------------------------------------------------------------
# Strip ?token= from access logs (http context — must live outside server{}).
# ---------------------------------------------------------------------------
map $request_uri $request_no_token {
    ~^(.*)\?(.*)token=[^&]*(.*)  $1?$2$3;
    default                       $request_uri;
}

log_format safe_log '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $request_no_token $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;

    # SSL — use Certbot / Let's Encrypt or your own certs
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/html/public;
    index index.php;

    # Security: /var/video-work/ must NEVER be served by Nginx
    # (no alias or root pointing there)

    # -------------------------------------------------------------------------
    # Upload endpoint — dedicated FPM pool with no timeout (C6)
    # -------------------------------------------------------------------------
    location = /api/upload {
        fastcgi_pass            unix:/run/php/php8.2-fpm-upload.sock;
        client_max_body_size    10G;
        client_body_timeout     300s;
        fastcgi_read_timeout    3600s;
        include                 fastcgi_params;
        fastcgi_param           SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param           PATH_INFO       $fastcgi_path_info;
    }

    # -------------------------------------------------------------------------
    # All other PHP requests — standard FPM pool
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass            unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout    60s;
        include                 fastcgi_params;
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param           PATH_INFO       $fastcgi_path_info;
    }

    # Hide dot files / sensitive directories
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/videosystem.access.log safe_log;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}
