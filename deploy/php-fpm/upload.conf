; PHP-FPM dedicated upload pool (C6)
;
; Place at: /etc/php/8.2/fpm/pool.d/upload.conf
;
; This pool is separate from the default pool so that:
;   - request_terminate_timeout = 0 only applies to upload requests
;   - Other endpoints retain normal timeouts (a hung default pool request
;     would otherwise be masked by a global 0 timeout)
;
; The Nginx upload location routes to this pool's socket.

[upload]
listen = /run/php/php8.2-fpm-upload.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

user  = www-data
group = www-data

pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; No timeout — upload + B2 transfer can exceed 20 minutes for large files
request_terminate_timeout = 0
php_admin_value[max_execution_time] = 0

; Memory limit for the upload process
php_admin_value[memory_limit] = 512M

; Large file handling — must match nginx client_max_body_size
php_admin_value[upload_max_filesize] = 10G
php_admin_value[post_max_size]       = 10G

; Log to separate file so upload activity is isolated
access.log = /var/log/php8.2-fpm-upload.access.log
