; Supervisor configuration for the stale job reaper (C4)
;
; IMPORTANT: This must be a SEPARATE Supervisor program from video-worker.
; The reaper must keep running even when all encode workers are down
; (e.g. after repeated OOM kills from a corrupt source file).
;
; Place at: /etc/supervisor/conf.d/job-reaper.conf
; Then: supervisorctl reread && supervisorctl update

[program:job-reaper]
command=php /var/www/html/bin/reaper.php
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startretries=10
stdout_logfile=/var/log/job-reaper.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/job-reaper-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
user=www-data

stopsignal=TERM
stopwaitsecs=30
