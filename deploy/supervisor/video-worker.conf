; Supervisor configuration for video encoding workers
;
; Place at: /etc/supervisor/conf.d/video-worker.conf
; Then: supervisorctl reread && supervisorctl update

[program:video-worker]
command=php /var/www/html/bin/worker.php
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/video-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/video-worker-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
user=www-data

; Supervisor sends SIGTERM on stop/restart — worker handles this gracefully
; (finishes current rendition, uploads result, then exits cleanly)
stopsignal=TERM
stopwaitsecs=600  ; allow up to 10 minutes for current rendition to finish

; Environment is inherited from Supervisor's env, but you can override here:
; environment=WORK_DIR="/var/video-work",FFMPEG_BIN="/usr/bin/ffmpeg"
